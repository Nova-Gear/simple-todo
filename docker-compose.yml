services:
  # --- Jenkins Service ---
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins # Gunakan custom Dockerfile
    container_name: jenkins
    restart: unless-stopped
    user: root # Tambahkan ini sementara agar tidak ada kendala izin pada /var/run/docker.sock
    ports:
      - "${JENKINS_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Sudah benar untuk akses host docker
    networks:
      - cicd-net

  # --- SonarQube Service ---
  sonarqube:
    image: sonarqube:${SONAR_VERSION:-community}
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "${SONAR_PORT:-9000}:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-sonarqube}
      - SONAR_JDBC_USERNAME=${POSTGRES_USER:-sonar}
      - SONAR_JDBC_PASSWORD=${POSTGRES_PASSWORD:-sonar_password}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - cicd-net
    depends_on:
      db:
        condition: service_healthy

  # --- Database for SonarQube ---
  db:
    image: postgres:15-alpine
    container_name: sonarqube-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sonar}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sonar_password}
      - POSTGRES_DB=${POSTGRES_DB:-sonarqube}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - cicd-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sonar} -d ${POSTGRES_DB:-sonarqube}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MySQL for Simple Todo App ---
  todo-db:
    image: mysql:8.0
    container_name: todo-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-todo_app}
      - MYSQL_USER=${MYSQL_USER:-todo_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-todo_password}
    ports:
      - "3307:3306"
    volumes:
      - todo_mysql_data:/var/lib/mysql
    networks:
      - cicd-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Simple Todo App (Production-like) ---
  todo-app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: todo-app
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - DB_HOST=todo-db
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_DATABASE:-todo_app}
      - DB_USERNAME=${MYSQL_USER:-todo_user}
      - DB_PASSWORD=${MYSQL_PASSWORD:-todo_password}
    networks:
      - cicd-net
    depends_on:
      todo-db:
        condition: service_healthy

networks:
  cicd-net:
    driver: bridge

volumes:
  jenkins_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
  todo_mysql_data:
