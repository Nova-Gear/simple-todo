---
# ConfigMap untuk environment variables app Flask
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-app-config
  namespace: todo-app
data:
  FLASK_ENV: "production"
  FLASK_DEBUG: "0"
  PORT: "5000"
  FLASK_PORT: "5000"    # app/config.py reads FLASK_PORT (default 5001); align with probe port
  # MySQL via Cloud SQL Auth Proxy (sidecar listen di 127.0.0.1:3306)
  DB_HOST: "127.0.0.1"
  DB_PORT: "3306"
  DB_NAME: "todo_db"
  LOG_LEVEL: "info"

---
# Secret untuk credentials MySQL
# Generate dengan: echo -n "nilai" | base64
apiVersion: v1
kind: Secret
metadata:
  name: todo-app-secret
  namespace: todo-app
type: Opaque
data:
  DB_USER: dG9kb191c2Vy                    # todo_user (base64)
  DB_PASSWORD: NjRCU3FIWmZNZkIwY1NWdTEwSURUeEJx  # password dari terraform.tfvars (base64)
  # Cara isi yang benar di terminal:
  # kubectl create secret generic todo-app-secret \
  #   --from-literal=DB_USER=todo_user \
  #   --from-literal=DB_PASSWORD=$(gcloud secrets versions access latest --secret="cloudsql-db-password") \
  #   -n todo-app --dry-run=client -o yaml | kubectl apply -f -
