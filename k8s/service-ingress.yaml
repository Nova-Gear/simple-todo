---
# Service — ClusterIP (internal, diakses via Ingress)
# Flask berjalan di port 5000
apiVersion: v1
kind: Service
metadata:
  name: simple-todo-svc
  namespace: todo-app
  labels:
    app: simple-todo
  annotations:
    cloud.google.com/backend-config: '{"default": "todo-backend-config"}'
spec:
  type: NodePort     # Diperlukan oleh GCE Ingress
  selector:
    app: simple-todo
  ports:
    - name: http
      port: 80
      targetPort: 5000   # Flask port
      protocol: TCP

---
# Ingress — Google Cloud LB tanpa domain (akses via Static IP langsung)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-todo-ingress
  namespace: todo-app
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "todo-static-ip"
    # Tidak pakai ManagedCertificate karena tanpa domain
    # Tidak pakai SSL dulu — HTTP only via IP
spec:
  defaultBackend:
    service:
      name: simple-todo-svc
      port:
        number: 80

---
# BackendConfig — attach Cloud Armor WAF + Health Check
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: todo-backend-config
  namespace: todo-app
spec:
  # Cloud Armor WAF — nama policy dari Terraform (modules/security)
  securityPolicy:
    name: "todo-waf-policy"

  # Health check ke Flask /health endpoint
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /health
    port: 5000

  connectionDraining:
    drainingTimeoutSec: 60

---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: simple-todo-hpa
  namespace: todo-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: simple-todo
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
