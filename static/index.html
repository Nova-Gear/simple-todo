<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple, beautiful todo application to organize your tasks efficiently.">
    <title>Simple Todo — Stay Organized</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Ambient Background Glow -->
    <div class="ambient-glow"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 11l3 3L22 4"/>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                        </svg>
                    </div>
                    <h1>Simple Todo</h1>
                </div>
                <p class="header-subtitle">Stay focused. Get things done.</p>
            </div>
        </header>

        <!-- Stats Bar -->
        <section class="stats-bar" id="statsBar">
            <div class="stat-card">
                <span class="stat-value" id="statTotal">0</span>
                <span class="stat-label">Total</span>
            </div>
            <div class="stat-card stat-active">
                <span class="stat-value" id="statActive">0</span>
                <span class="stat-label">Active</span>
            </div>
            <div class="stat-card stat-completed">
                <span class="stat-value" id="statCompleted">0</span>
                <span class="stat-label">Done</span>
            </div>
        </section>

        <!-- Add Todo Form -->
        <section class="add-todo-section">
            <form id="addTodoForm" class="add-todo-form">
                <div class="form-row">
                    <div class="input-group input-title">
                        <input
                            type="text"
                            id="todoTitle"
                            placeholder="What needs to be done?"
                            autocomplete="off"
                            required
                            maxlength="255"
                        >
                    </div>
                    <button type="submit" class="btn-add" id="btnAdd">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        <span>Add</span>
                    </button>
                </div>
                <div class="form-row form-row-secondary">
                    <div class="input-group input-desc">
                        <input
                            type="text"
                            id="todoDescription"
                            placeholder="Add a description (optional)"
                            autocomplete="off"
                            maxlength="500"
                        >
                    </div>
                    <div class="priority-selector" id="prioritySelector">
                        <button type="button" class="priority-btn" data-priority="low" title="Low priority">
                            <span class="priority-dot low"></span>Low
                        </button>
                        <button type="button" class="priority-btn active" data-priority="medium" title="Medium priority">
                            <span class="priority-dot medium"></span>Med
                        </button>
                        <button type="button" class="priority-btn" data-priority="high" title="High priority">
                            <span class="priority-dot high"></span>High
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Filter Tabs -->
        <section class="filter-section">
            <div class="filter-tabs" id="filterTabs">
                <button class="filter-tab active" data-filter="all">All</button>
                <button class="filter-tab" data-filter="active">Active</button>
                <button class="filter-tab" data-filter="completed">Completed</button>
            </div>
        </section>

        <!-- Todo List -->
        <section class="todo-list-section">
            <ul class="todo-list" id="todoList">
                <!-- Todos rendered here by JS -->
            </ul>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-icon">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <line x1="9" y1="9" x2="15" y2="15"/>
                        <line x1="15" y1="9" x2="9" y2="15"/>
                    </svg>
                </div>
                <p class="empty-title">No tasks yet</p>
                <p class="empty-subtitle">Add your first todo to get started!</p>
            </div>

            <!-- Loading State -->
            <div class="loading-state" id="loadingState">
                <div class="spinner"></div>
                <p>Loading tasks...</p>
            </div>
        </section>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Edit Task</h2>
                <button class="modal-close" id="modalClose">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <form id="editTodoForm">
                <input type="hidden" id="editTodoId">
                <div class="modal-field">
                    <label for="editTitle">Title</label>
                    <input type="text" id="editTitle" required maxlength="255">
                </div>
                <div class="modal-field">
                    <label for="editDescription">Description</label>
                    <input type="text" id="editDescription" maxlength="500">
                </div>
                <div class="modal-field">
                    <label>Priority</label>
                    <div class="priority-selector" id="editPrioritySelector">
                        <button type="button" class="priority-btn" data-priority="low">
                            <span class="priority-dot low"></span>Low
                        </button>
                        <button type="button" class="priority-btn" data-priority="medium">
                            <span class="priority-dot medium"></span>Med
                        </button>
                        <button type="button" class="priority-btn" data-priority="high">
                            <span class="priority-dot high"></span>High
                        </button>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="btnCancelEdit">Cancel</button>
                    <button type="submit" class="btn-save">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/app.js"></script>
</body>
</html>
